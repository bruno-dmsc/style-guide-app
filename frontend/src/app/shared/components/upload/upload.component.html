<p-fileUpload #primeUpload mode="advanced" [multiple]="multiple" customUpload="true" [disabled]="disabled"
    (onSelect)="handleSelect($event)">

    <!-- TUDO DEVE FICAR DENTRO DO TEMPLATE DO PRIMENG -->
    <ng-template pTemplate="content" let-files>

        <!-- ESTADO 1: CARREGANDO -->
        <div *ngIf="isLoading" class="desmonte-upload-zone desmonte-upload-zone--loading">
            <p-progressSpinner class="desmonte-upload-zone__spinner"></p-progressSpinner>
            <p class="desmonte-upload-zone__title">{{ loadingText }}</p>
        </div>

        <!-- ESTADO 2: ERRO DE VALIDAÇÃO -->
        <div *ngIf="errorMessage && !isLoading" class="desmonte-upload-zone desmonte-upload-zone--error">
            <i class="pi pi-times-circle desmonte-upload-zone__icon"></i>
            <p class="desmonte-upload-zone__title">{{ errorMessage }}</p>
            <div class="desmonte-upload-zone__actions">
                <button pButton label="Tentar novamente" severity="danger" [text]="true"
                    (click)="clearError()"></button>
            </div>
        </div>

        <!-- ESTADO 3: VAZIO -->
        <div *ngIf="!isLoading && !errorMessage && files.length === 0" class="desmonte-upload-zone"
            [ngClass]="{'desmonte-upload-zone--disabled': disabled}" (click)="triggerChoose()">

            <i class="desmonte-upload-zone__icon pi pi-upload" *ngIf="!disabled"></i>
            <i class="desmonte-upload-zone__icon pi pi-lock" *ngIf="disabled"></i>

            <h3 class="desmonte-upload-zone__title">{{ disabled ? 'Upload bloqueado' : title }}</h3>
            <p class="desmonte-upload-zone__subtitle">{{ subtitle }}</p>
        </div>

        <!-- ESTADO 4: GALERIA PREENCHIDA -->
        <div *ngIf="!isLoading && !errorMessage && files.length > 0" class="image-gallery">

            <!-- ADIÇÃO: Contador flutuante no canto da galeria -->
            <span class="image-gallery__counter" [class.image-gallery__counter--full]="files.length === maxFiles"
                *ngIf="maxFiles > 1">
                {{ files.length }} de {{ maxFiles }} permitidos
            </span>

            <!-- A Galeria de itens -->
            <div *ngFor="let file of files; let i = index" class="image-gallery__item" draggable="true"
                (dragstart)="onItemDragStart($event, i)" (dragover)="onItemDragOver($event, i)"
                (dragleave)="onItemDragLeave($event, i)" (drop)="onItemDrop($event, i)" (dragend)="onItemDragEnd()"
                [class.image-gallery__item--dragged]="draggedIndex === i"
                [class.image-gallery__item--drag-target]="dragOverIndex === i">

                <i class="image-gallery__action pi pi-trash" (click)="handleRemove($event, i)"></i>

                <div class="image-gallery__placeholder"
                    (click)="file.type.startsWith('image') ? openFullscreen(i) : null"
                    [style.cursor]="file.type.startsWith('image') ? 'zoom-in' : 'default'">

                    <img *ngIf="file.type.startsWith('image')" [src]="$any(file).objectURL" alt="Preview da mídia">
                    <i *ngIf="!file.type.startsWith('image')" class="pi pi-file-pdf"
                        style="font-size: 2rem; color: var(--fundo-400);"></i>
                </div>

                <span *ngIf="i === 0" class="image-gallery__badge">Capa</span>
            </div>

            <div *ngIf="files.length < maxFiles" class="image-gallery__upload" (click)="triggerChoose()">
                <i class="pi pi-image" style="font-size: 2rem; color: var(--fundo-600);"></i>
                <span class="image-gallery__upload-text">Arraste aqui ou selecione<br>um arquivo</span>
            </div>

        </div>

    </ng-template>
</p-fileUpload>

<!-- ========================================== -->
<!-- MODAL FULLSCREEN DE VISUALIZAÇÃO DE IMAGEM -->
<!-- ========================================== -->
<p-dialog [(visible)]="displayFullscreen" [modal]="true" [dismissableMask]="true" position="top"
    styleClass="desmonte-fullscreen-dialog">

    <!-- Ilha de Controles: Agora logo abaixo do header, no fluxo normal da tela -->
    <div class="desmonte-fullscreen-dialog__controls" style="text-align: center;">
        <button pButton icon="pi pi-search-minus" class="p-button-rounded p-button-text" (click)="zoomOut()"></button>
        <span class="desmonte-fullscreen-dialog__zoom-text">{{ zoomLevel * 100 }}%</span>
        <button pButton icon="pi pi-search-plus" class="p-button-rounded p-button-text" (click)="zoomIn()"></button>

        <button pButton icon="pi pi-chevron-left" class="p-button-rounded p-button-text" (click)="prevImage()"
            [disabled]="!hasPrevImage"></button>
        <button pButton icon="pi pi-chevron-right" class="p-button-rounded p-button-text" (click)="nextImage()"
            [disabled]="!hasNextImage"></button>
    </div>

    <!-- Container da Imagem (usando a sua abordagem de estilo dinâmico) -->
    <div class="desmonte-fullscreen-dialog__image-wrapper">
        <img [src]="currentImageUrl" [style.transform]="'scale(' + zoomLevel + ')'"
            class="desmonte-fullscreen-dialog__image" alt="Visualização expandida da peça"
            [style]="{objectFit: 'contain'}">
    </div>

</p-dialog>
